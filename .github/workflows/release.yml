name: Release
run-name: Release ${{ inputs.bump }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Semver increment
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch
            dry_run:
                description: Dry run (bump, check, pack, and test the push, but publish nothing)
                type: boolean
                default: false

# Each job asks for what it needs; nothing is granted by default.
permissions: {}

# One release at a time. A queued run then fails cleanly: its version is taken,
# or main has moved, so it cannot push.
concurrency:
    group: release
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    # Runs the dev toolchain, so it can push to the repository but cannot
    # publish to npm.
    prepare:
        name: Prepare the ${{ inputs.bump }} release
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: write # push the release commit and tag
        outputs:
            version: ${{ steps.bump.outputs.version }}
            tarball: ${{ steps.pack.outputs.tarball }}
        steps:
            - name: Require the main branch
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Releases run from main, not $GITHUB_REF"
                  exit 1

            - name: Check out main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Keep the push token out of .git/config while dev tools run.
                  # The push step hands it to that one git command.
                  persist-credentials: false

            # The version comes from the packageManager field in package.json.
            - name: Set up pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  # Releases install from scratch. A restored cache is an input
                  # that another workflow run could have poisoned.
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Bump the version and changelog
              id: bump
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  version=$(node scripts/release-workflow.mjs bump "$BUMP")
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Refuse a version that already exists
              env:
                  VERSION: ${{ steps.bump.outputs.version }}
              run: |
                  tags=$(git ls-remote --tags origin "refs/tags/v$VERSION")
                  if [ -n "$tags" ]; then
                      echo "::error::Tag v$VERSION already exists"
                      exit 1
                  fi
                  status=$(curl -sS -o /dev/null -w '%{http_code}' \
                      "https://registry.npmjs.org/cycling-ble/$VERSION?release_check=$(date +%s)")
                  if [ "$status" != 404 ]; then
                      echo "::error::npm answered HTTP $status for cycling-ble@$VERSION, not 404"
                      exit 1
                  fi

            # Includes format:check, which also covers the rewritten changelog.
            - name: Run the full check
              run: pnpm run check

            - name: Pack and inspect the package
              id: pack
              run: |
                  mkdir "$RUNNER_TEMP/package"
                  npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
                  tarball=$(node scripts/release-workflow.mjs validate "$RUNNER_TEMP/pack.json")
                  echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

            - name: Commit and tag the release
              env:
                  VERSION: ${{ steps.bump.outputs.version }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
                  git add package.json CHANGELOG.md
                  git -c core.hooksPath=/dev/null commit --quiet -m "Release $VERSION"
                  git tag -a "v$VERSION" -m "Release $VERSION"
                  if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
                      git status --short
                      echo "::error::The check changed tracked files that the release commit leaves out"
                      exit 1
                  fi

            # Uploaded before the push, so the publish job always finds the
            # exact tarball that passed the checks, including on a re-run.
            - name: Upload the package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
                  if-no-files-found: error
                  retention-days: 30

            # Atomic: the commit and the tag land together or not at all, and
            # the push is refused if main moved after this run started. A dry
            # run still asks GitHub whether the push would be accepted.
            - name: Push the release commit and tag
              env:
                  VERSION: ${{ steps.bump.outputs.version }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
                  echo "::add-mask::$auth"
                  args=(--atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION")
                  if [ "$DRY_RUN" = true ]; then
                      args=(--dry-run "${args[@]}")
                  fi
                  GIT_CONFIG_COUNT=1 \
                      GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                      GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
                      git -c core.hooksPath=/dev/null push "${args[@]}"

            - name: Summarize
              env:
                  VERSION: ${{ steps.bump.outputs.version }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  {
                      if [ "$DRY_RUN" = true ]; then
                          echo "## Dry run: cycling-ble $VERSION passed; nothing was pushed or published"
                      else
                          echo "## Pushed v$VERSION; the publish job releases it to npm"
                      fi
                      echo
                      node scripts/release-workflow.mjs notes
                  } >> "$GITHUB_STEP_SUMMARY"

    # Installs and runs no project dependencies, so it is the only job that
    # may request the OIDC token npm accepts for publishing. If it fails,
    # "Re-run failed jobs" publishes the same tarball.
    publish:
        name: Publish to npm
        needs: prepare
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment:
            name: npm
            url: https://www.npmjs.com/package/cycling-ble/v/${{ needs.prepare.outputs.version }}
        permissions:
            contents: write # create the GitHub release
            id-token: write # npm trusted publishing, which also signs the provenance
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            TARBALL: ${{ needs.prepare.outputs.tarball }}
        steps:
            # Root files such as .nvmrc and CHANGELOG.md, plus the helper scripts.
            - name: Check out the release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/v${{ needs.prepare.outputs.version }}
                  persist-credentials: false
                  sparse-checkout: scripts

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false

            - name: Require npm 11.5.1 or later for trusted publishing
              run: |
                  current=$(npm --version)
                  if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n 1)" != 11.5.1 ]; then
                      echo "::error::npm $current cannot use trusted publishing"
                      exit 1
                  fi

            - name: Download the checked package
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/package

            # No token is configured. npm exchanges this job's OIDC token for a
            # short-lived publish credential and attaches signed provenance.
            - name: Publish to npm
              run: |
                  status=$(curl -sS -o /dev/null -w '%{http_code}' \
                      "https://registry.npmjs.org/cycling-ble/$VERSION?release_check=$(date +%s)")
                  if [ "$status" = 200 ]; then
                      echo "::notice::cycling-ble@$VERSION is already on npm; verifying it instead"
                  elif [ "$status" = 404 ]; then
                      npm publish "$RUNNER_TEMP/package/$TARBALL" \
                          --access public --tag latest --provenance --ignore-scripts \
                          --registry https://registry.npmjs.org/
                  else
                      echo "::error::npm answered HTTP $status for cycling-ble@$VERSION"
                      exit 1
                  fi

            - name: Verify the registry serves this tarball
              run: node scripts/release-workflow.mjs verify "$RUNNER_TEMP/package/$TARBALL"

            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      echo "::notice::GitHub release v$VERSION already exists"
                      exit 0
                  fi
                  node scripts/release-workflow.mjs notes > "$RUNNER_TEMP/notes.md"
                  gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
                      --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
