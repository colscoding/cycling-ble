name: Publish

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    id-token: write # required for npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            # Version comes from the packageManager field in package.json.
            # Passing `version` here as well makes the action fail on mismatch.
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: pnpm
            # pnpm publish takes the version from package.json, not the tag, so a
            # mismatch would publish something other than what the tag names.
            - name: Check the tag matches package.json
              run: |
                  expected="v$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_NAME" != "$expected" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
                      exit 1
                  fi
            - run: pnpm install --frozen-lockfile
            # prepublishOnly runs the full check, so there is no separate step.
            - run: pnpm publish --access public --no-git-checks --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
