name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            # Version comes from the packageManager field in package.json.
            # Passing `version` here as well makes the action fail on mismatch.
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            # The development toolchain needs Node 22; the published package
            # promises Node 20.0.0 and is checked separately at that boundary.
            - uses: actions/setup-node@v5
              with:
                  node-version: 20.0.0
                  # setup-node probes for a package manager cache by running
                  # `pnpm store path`, and pnpm 11 refuses to start on Node 20.
                  # The probe is on by default and would fail this step before
                  # the check below runs.
                  package-manager-cache: false
            - run: node --test scripts/check-package.mjs
